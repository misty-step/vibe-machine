name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, edited]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release-note title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node -e 'if (!/^(feat|fix|chore|docs|test|build|ci|refactor|style|perf|revert)(\([^\r\n)]+\))?!?: .+$/.test(process.env.PR_TITLE)) process.exit(1)'

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Test
        run: pnpm test:run

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Create dummy FFmpeg for CI
        run: |
          mkdir -p src-tauri/bin
          touch src-tauri/bin/ffmpeg-x86_64-unknown-linux-gnu

      - name: Cargo check
        run: cargo check --manifest-path=src-tauri/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path=src-tauri/Cargo.toml -- -D warnings

      - name: Native tests
        run: cargo test --locked --manifest-path=src-tauri/Cargo.toml

  merge-gate:
    name: merge-gate
    runs-on: ubuntu-latest
    needs: [quality, rust]
    if: always()
    steps:
      - name: Require all CI jobs to pass
        run: |
          if [ "${{ needs.quality.result }}" != "success" ] || [ "${{ needs.rust.result }}" != "success" ]; then
            exit 1
          fi
