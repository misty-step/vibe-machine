name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened, edited]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release-note title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node -e 'if (!/^(feat|fix|chore|docs|test|build|ci|refactor|style|perf|revert)(\([^\r\n)]+\))?!?: .+$/.test(process.env.PR_TITLE)) process.exit(1)'

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm build

      - name: Exercise the compiled application in a real browser
        timeout-minutes: 2
        run: node scripts/smoke-app.mjs

      - name: Build the site and its canonical release notes
        run: |
          pnpm site:build
          pnpm exec wrangler versions upload --config site/wrangler.jsonc --env production --dry-run --outdir "$PWD/dist/worker"

      - name: Exercise the compiled Worker with its actual assets
        run: |
          pnpm exec wrangler dev "$PWD/dist/worker/worker.js" --no-bundle --config site/wrangler.jsonc --env production --local --port 8787 > "$RUNNER_TEMP/site.log" 2>&1 &
          worker=$!
          trap 'kill "$worker" 2>/dev/null || true' EXIT
          curl --fail --retry 20 --retry-connrefused --retry-delay 1 http://127.0.0.1:8787/release.json -o "$RUNNER_TEMP/release.json"
          cmp dist/site/release.json "$RUNNER_TEMP/release.json"
          curl --fail http://127.0.0.1:8787/changelog -o "$RUNNER_TEMP/changelog.html"
          cmp dist/site/changelog.html "$RUNNER_TEMP/changelog.html"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/worker.js)" = 404

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm type-check

      - name: Test
        run: pnpm test:run

      - uses: actions/upload-artifact@v4
        with:
          name: site-candidate
          path: |
            dist/site
            dist/worker
          if-no-files-found: error
          retention-days: 14

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Create dummy FFmpeg for CI
        run: |
          mkdir -p src-tauri/bin
          touch src-tauri/bin/ffmpeg-x86_64-unknown-linux-gnu

      - name: Cargo check
        run: cargo check --manifest-path=src-tauri/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path=src-tauri/Cargo.toml -- -D warnings

      - name: Native tests
        run: cargo test --locked --manifest-path=src-tauri/Cargo.toml

  merge-gate:
    name: merge-gate
    runs-on: ubuntu-latest
    needs: [quality, rust]
    if: always()
    steps:
      - name: Require all CI jobs to pass
        run: |
          if [ "${{ needs.quality.result }}" != "success" ] || [ "${{ needs.rust.result }}" != "success" ]; then
            exit 1
          fi

  deploy-site:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [quality, rust]
    runs-on: ubuntu-latest
    concurrency:
      group: site-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: site-candidate
          path: dist
      - name: Preview and promote the same verified site artifact
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          WRANGLER_SEND_METRICS: "false"
        run: node scripts/deploy-site.mjs
