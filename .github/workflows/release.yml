name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      approve_only:
        type: boolean
        default: false
        description: Approve pending native release PR CI without generating a release
      resume_tag:
        type: string
        default: ""
        description: Resume an empty bot draft at the current verified source (no existing tag may move)

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    if: (github.event_name == 'workflow_dispatch' && !inputs.approve_only) || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'master' && github.event.workflow_run.conclusion == 'success')
    runs-on: [self-hosted, hetzner-ci, vibe-machine-ci]
    outputs:
      release_created: ${{ steps.release.outputs.release_created || steps.resume.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name || steps.resume.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha || steps.resume.outputs.sha }}
      release_id: ${{ steps.release.outputs.id || steps.resume.outputs.id }}
    steps:
      - name: Install GitHub CLI
        run: sudo apt-get update && sudo apt-get install -y gh
      - uses: actions/github-script@v7
        name: Require green CI on the current source
        with:
          script: |
            const { data: branch } = await github.rest.repos.getBranch({ ...context.repo, branch: 'master' });
            const sha = context.payload.workflow_run?.head_sha ?? context.sha;
            if (branch.commit.sha !== sha) throw new Error('Refusing stale release source');
            const { data } = await github.rest.actions.listWorkflowRuns({ ...context.repo, workflow_id: 'ci.yml', head_sha: sha, event: 'push', per_page: 1 });
            if (data.workflow_runs[0]?.conclusion !== 'success') throw new Error('Current source has no successful CI');

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        if: inputs.resume_tag == ''
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

      - uses: actions/github-script@v7
        id: resume
        if: inputs.resume_tag != ''
        name: Resume only an empty unpublished bot draft
        env:
          RESUME_TAG: ${{ inputs.resume_tag }}
        with:
          script: |
            const tag = process.env.RESUME_TAG;
            const releases = await github.paginate(github.rest.repos.listReleases, { ...context.repo, per_page: 100 });
            const draft = releases.find(r => r.tag_name === tag);
            if (!draft?.draft || draft.assets.length || draft.author.login !== 'github-actions[bot]') throw new Error('Only an empty bot draft can resume');
            const { data: file } = await github.rest.repos.getContent({ ...context.repo, path: 'package.json', ref: context.sha });
            const pkg = JSON.parse(Buffer.from(file.content, 'base64').toString());
            if (tag !== `v${pkg.version}`) throw new Error('Draft must match the generated source version');
            try {
              const { data: ref } = await github.rest.git.getRef({ ...context.repo, ref: `tags/${tag}` });
              if (ref.object.sha !== context.sha) throw new Error('Refusing to move an immutable tag');
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.updateRelease({ ...context.repo, release_id: draft.id, target_commitish: context.sha, tag_name: tag, name: draft.name, body: draft.body, draft: true, prerelease: draft.prerelease });
            const { data: confirmed } = await github.rest.repos.getRelease({ ...context.repo, release_id: draft.id });
            if (!confirmed.draft || confirmed.target_commitish !== context.sha || confirmed.tag_name !== tag || confirmed.name !== draft.name || confirmed.body !== draft.body || confirmed.prerelease !== draft.prerelease) throw new Error('Draft source/metadata readback failed');
            core.setOutput('release_created', 'true');
            core.setOutput('id', String(draft.id));
            core.setOutput('tag_name', tag);
            core.setOutput('sha', context.sha);

      - uses: actions/github-script@v7
        id: baseline
        name: Require the generator's actual tag baseline
        with:
          script: |
            const { data: file } = await github.rest.repos.getContent({ ...context.repo, path: '.release-please-manifest.json', ref: context.sha });
            const version = JSON.parse(Buffer.from(file.content, 'base64').toString())['.'];
            if (!version) throw new Error('Missing generator baseline version');
            let exists = false;
            try {
              await github.rest.git.getRef({ ...context.repo, ref: `tags/v${version}` });
              exists = true;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            console.log(`Generator baseline v${version}: immutable tag ${exists ? 'present' : 'absent; leave the pending release alone'}`);
            core.setOutput('exists', String(exists));

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        if: steps.baseline.outputs.exists == 'true'
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-release: true

      # GITHUB_TOKEN-created approval-required runs emit no workflow_run event.
      # A separate dispatch is native, delayed until after PR creation, and recoverable.
      - name: Dispatch native release PR CI approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref master -f approve_only=true

  approve-release-ci:
    if: inputs.approve_only || github.event.workflow_run.event == 'pull_request'
    runs-on: [self-hosted, hetzner-ci, vibe-machine-ci]
    steps:
      - uses: actions/github-script@v7
        name: Approve native release PR CI, including delayed or unchanged runs
        with:
          script: |
            const prs = await github.paginate(github.rest.pulls.list, { ...context.repo, state: 'open', base: 'master', per_page: 100 });
            for (const pr of prs) {
              if (pr.head.repo.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
                  !pr.head.ref.startsWith('release-please--branches--master') ||
                  pr.user.login !== 'github-actions[bot]') continue;
              const { data } = await github.rest.actions.listWorkflowRuns({ ...context.repo, workflow_id: 'ci.yml', event: 'pull_request', head_sha: pr.head.sha, per_page: 100 });
              if (!data.workflow_runs.length) throw new Error('Release PR CI has not appeared; retry this approval dispatch');
              for (const run of data.workflow_runs) {
                if (run.conclusion !== 'action_required') continue;
                if (!run.pull_requests.some(p => p.number === pr.number)) throw new Error('Run does not belong to release PR');
                const { data: current } = await github.rest.pulls.get({ ...context.repo, pull_number: pr.number });
                if (current.head.sha !== run.head_sha) throw new Error('Release PR moved');
                await github.rest.actions.approveWorkflowRun({ ...context.repo, run_id: run.id });
              }
            }

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: macos-15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
      RELEASE_ID: ${{ needs.release-please.outputs.release_id }}
    steps:
      - uses: actions/github-script@v7
        name: Require green CI for the actual draft release source
        env:
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
        with:
          script: |
            const sha = process.env.RELEASE_SHA;
            if (!/^[0-9a-f]{40}$/.test(sha || '')) throw new Error('Missing release source');
            const { data } = await github.rest.actions.listWorkflowRuns({ ...context.repo, workflow_id: 'ci.yml', head_sha: sha, event: 'push', per_page: 1 });
            if (data.workflow_runs[0]?.conclusion !== 'success') throw new Error('Actual release source has no successful CI');
            const { data: release } = await github.rest.repos.getRelease({ ...context.repo, release_id: Number(process.env.RELEASE_ID) });
            if (!release.draft || release.tag_name !== process.env.RELEASE_TAG || release.target_commitish !== sha) throw new Error('Draft ID does not match the verified source/tag');

      # Draft tags are not public yet; build the generator's exact source SHA.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Cache Rust builds for faster CI
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - run: pnpm install --frozen-lockfile

      - name: Setup FFmpeg
        run: ./scripts/setup-ffmpeg.sh

      - name: Build the application frontend once
        run: pnpm build

      - name: Exercise the exact frontend before native packaging
        timeout-minutes: 2
        env:
          CHROME_BIN: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
        run: node scripts/smoke-app.mjs

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: Add these secrets for proper code signing
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          releaseId: ${{ needs.release-please.outputs.release_id }}
          tagName: ${{ env.RELEASE_TAG }}
          # Don't set releaseName - preserves release-please changelog
          releaseDraft: true
          prerelease: false
          args: --target aarch64-apple-darwin --config '{"build":{"beforeBuildCommand":null}}'

      - name: Exercise native install, update, rollback and bundled codecs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/smoke-macos-release.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-release-smoke
          path: ${{ runner.temp }}/vibe-release-smoke/evidence
          if-no-files-found: error
          retention-days: 14

      - name: Publish stable latest alias
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dmg_count=$(find src-tauri/target -path "*/bundle/dmg/*.dmg" | wc -l | tr -d ' ')
          if [ "$dmg_count" -ne 1 ]; then
            echo "::error::Expected exactly one DMG, found $dmg_count"
            exit 1
          fi

          dmg=$(find src-tauri/target -path "*/bundle/dmg/*.dmg" -print -quit)
          cp "$dmg" /tmp/vibe-machine-latest.dmg
          gh release upload "$RELEASE_TAG" /tmp/vibe-machine-latest.dmg --clobber
          shasum -a 256 "$dmg" /tmp/vibe-machine-latest.dmg > SHA256SUMS.txt
          git rev-parse HEAD > SOURCE_REVISION.txt
          gh release upload "$RELEASE_TAG" SHA256SUMS.txt SOURCE_REVISION.txt

      - name: Publish the completed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest

      - name: Summary
        run: |
          echo "## Release ${{ env.RELEASE_TAG }} Published! 🎉" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ DMG built and attached to GitHub release" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Stable latest-download alias refreshed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ GitHub Releases is the canonical download origin" >> $GITHUB_STEP_SUMMARY
          echo "- ℹ️ The Homebrew tap syncs independently from the latest GitHub release" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Users can update via:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "brew upgrade --cask vibe-machine" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
