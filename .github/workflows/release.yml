name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: node
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
    steps:
      # Checkout the specific tag to avoid race with new commits
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      # Sync tauri.conf.json version from tag (release-please extra-files is unreliable)
      - name: Sync Tauri version
        run: |
          VERSION="${RELEASE_TAG#v}"
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > tmp.json
          mv tmp.json src-tauri/tauri.conf.json
          echo "Set tauri.conf.json version to $VERSION"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Cache Rust builds for faster CI
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - run: pnpm install

      - name: Setup FFmpeg
        run: ./scripts/setup-ffmpeg.sh

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional: Add these secrets for proper code signing
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          # Don't set releaseName - preserves release-please changelog
          releaseDraft: false
          prerelease: false
          args: --target aarch64-apple-darwin

      - name: Publish stable latest alias
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dmg_count=$(find src-tauri/target -path "*/bundle/dmg/*.dmg" | wc -l | tr -d ' ')
          if [ "$dmg_count" -ne 1 ]; then
            echo "::error::Expected exactly one DMG, found $dmg_count"
            exit 1
          fi

          dmg=$(find src-tauri/target -path "*/bundle/dmg/*.dmg" -print -quit)
          cp "$dmg" /tmp/vibe-machine-latest.dmg
          gh release upload "$RELEASE_TAG" /tmp/vibe-machine-latest.dmg --clobber

      - name: Summary
        run: |
          echo "## Release ${{ env.RELEASE_TAG }} Published! 🎉" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ DMG built and attached to GitHub release" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Stable latest-download alias refreshed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ GitHub Releases is the canonical download origin" >> $GITHUB_STEP_SUMMARY
          echo "- ℹ️ The Homebrew tap syncs independently from the latest GitHub release" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Users can update via:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "brew upgrade --cask vibe-machine" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
